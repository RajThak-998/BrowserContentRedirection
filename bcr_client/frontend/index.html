<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC Player</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            overflow: hidden;
            /* Clips the video when the overlay is cropped to the viewport */
        }

        body {
            position: relative;
            /* Containing block for the absolutely-positioned video */
        }

        /* Make the video fill the entire screen structure.
           When the overlay window is clipped (player partially scrolled out of
           view in the VDI), main.js overrides width/height/left/top with
           percentages so the picture stays aligned — see the onVideoClip
           handler. Hence position:absolute rather than static. */
        video {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* or 'contain' if you don't want cropped edges */
        }
    </style>
</head>

<body>
    <video id="videoPlayer" autoplay playsinline controls></video>

    <script src="./src/main.js" type="module"></script>
</body>

</html>
