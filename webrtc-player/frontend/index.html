<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC Player</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            overflow: hidden;
            /* Prevent scrolling */
        }

        /* Make the video fill the entire screen structure */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* or 'contain' if you don't want cropped edges */
        }
    </style>
</head>

<body>
    <video id="videoPlayer" autoplay playsinline controls></video>

    <script src="./src/main.js" type="module"></script>
</body>

</html>
